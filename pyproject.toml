[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-discovery-challenge"
version = "0.1.0"
description = "FINAL-Bench Open Discovery Challenge search harness (Season 1, PfDHODH)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Juntae Kim" }]
dependencies = [
    "httpx>=0.27",
    "rdkit>=2023.9.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Local AutoDock Vina docking (discovery/judgment/dock.py). The vina binary itself
# is not a Python package; see the Docking Setup section of the README.
# scipy and gemmi are imported by meeko at load time; prody is needed by
# mk_prepare_receptor.py to build the 5TBO receptor PDBQT.
dock = ["meeko>=0.7", "scipy", "gemmi", "prody"]

[project.scripts]
discovery = "discovery.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["discovery*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
