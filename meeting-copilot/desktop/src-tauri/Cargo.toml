[package]
name = "meeting-copilot-desktop"
version = "0.3.0"
description = "Meeting Copilot overlay"
authors = ["Meeting Copilot"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }

[lib]
name = "meeting_copilot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
