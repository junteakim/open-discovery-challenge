[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-copilot"
version = "0.1.0"
description = "Local Mac meeting copilot with ontology context and free STT/translation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
stt = ["faster-whisper>=1.0"]
translate = ["ctranslate2>=4.0", "transformers>=4.40", "sentencepiece>=0.2"]
dev = ["pytest>=8.0"]

[project.scripts]
meeting-copilot = "meeting_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["meeting_copilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
