name: SMC DraftLine Desktop (Windows portable exe)

on:
  push:
    branches: ["**"]
    paths:
      - "cad-lite-desktop/**"
      - ".github/workflows/cad-lite-desktop-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cad-lite-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cad-lite-desktop/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 포터블 단일 exe 빌드
        run: npm run build:win
        env:
          GH_TOKEN: ""

      - name: 단일 exe만 산출되었는지 확인
        shell: pwsh
        run: |
          $exes = Get-ChildItem release -Filter *.exe
          $exes | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
          if ($exes.Count -ne 1) { throw "exe 파일이 1개여야 합니다 (현재 $($exes.Count)개)" }

      - name: 빌드 결과 업로드
        uses: actions/upload-artifact@v4
        with:
          name: SMC-DraftLine-windows-portable-exe
          path: cad-lite-desktop/release/*.exe
          if-no-files-found: error
          retention-days: 30
